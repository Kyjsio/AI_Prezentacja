<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projekt AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }

    .wrap {
      width: min(900px, 90vw);
      padding: 32px;
    }

    .wrap > h1 {
      margin-top: 0;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.2;
    }

    .wrap > p {
      font-size: 1.05rem;
      line-height: 1.7;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
      margin-top: 28px;
    }

    .card {
      padding: 20px;
    }

    .card h2 {
      margin: 0 0 10px;
      font-size: 1.2rem;
    }

    .card a {
      display: inline-block;
      margin-top: 12px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Projekt AI</h1>
    <p>Tworzenie awatarów, generowanie filmików z zdjęć</p>

    <div class="grid">
      <article class="card">
        <h2>Prezentacja główna</h2>
        <p>Omówienie generatorów wideo, awatarów AI i technologii TTS.</p>
        <a href="Instrukcje/Prezentacja_Awatary_AI.html">Otwórz prezentację</a>
      </article>

      <article class="card">
        <h2>Instrukcja VisionStory</h2>
        <p>Krótki przewodnik krok po kroku dotyczący zakładania konta i pracy z platformą.</p>
        <a href="Instrukcje/VisionStory.html">Otwórz instrukcję</a>
      </article>
    </div>
  </main>
</body>
</html>
